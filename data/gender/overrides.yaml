# Per-character overrides applied after automatic gendering.
# Keys: name, ability, firstNightReminder, otherNightReminder, flavor, reminders (list)
librarian:
  name: "Bibliothekar:in"
  ability: "Du weißt zu Beginn, dass 1 von 2 Spieler:innen ein:e bestimmte:r Außenseiter:in ist. (Oder dass keine mitspielen.)"

fortuneteller:
  name: "Wahrsager:in"
  ability: "Wähle jede Nacht 2 Spieler:innen. Du erfährst, ob 1 davon der Dämon ist. 1 gute:r Spieler:in erscheint dir fälschlich als Dämon."

empath:
  name: "Empath:in"
  ability: "Jede Nacht erfährst du, wie viele deiner 2 lebendigen Nachbar:innen böse sind."

noble:
  name: "Adlige:r"

amnesiac:
  name: "Vergessliche:r"

artist:
  ability: "Einmal im Spiel, während des Tages, stelle der/dem Erzähler:in geheim 1 beliebige Ja/Nein-Frage."

moonchild:
  ability: "Wenn du erfährst, dass du gestorben bist, wähle öffentlich 1 lebendige:n Spieler:in. Falls es ein:e gute:r Spieler:in war, stirbt die Person heute Nacht."

baron:
  ability: "Es sind zusätzliche Außenseiter:innen im Spiel. [+2 Außenseiter:innen]"

devilsadvocate:
  ability: "Wähle jede Nacht 1 lebendige:n Spieler:in (1 andere:n als in der vorherigen Nacht): Falls die Person am nächsten Tag hingerichtet wird, stirbt die Person nicht."

scarletwoman:
  ability: "Falls 5 oder mehr Spieler:innen lebendig sind & der Dämon stirbt, wirst du zum Dämon. (Reisende zählen nicht.)"
